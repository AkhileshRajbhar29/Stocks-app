  <path d="M240 470 L300 440 L360 455 L420 400 L480 410 L540 350 L600 325 L650 285" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="650" cy="285" r="9" fill="#fff" stroke="#2563EB" stroke-width="5"/>

